title: Error

pages: false

options:
  preview: true

fields:
  title:
    label: Title
    type:  text
    width: 1/2
  sub_title:
    label: Sub title
    type:  text
    width: 1/2
  sub_para:
    label: content
    type:  textarea
    buttons: false
    width: 1/1
  button_anchor:
    label: Pages
    type: select
    width: 1/2
    options: query
    sort: asc
    query:
      page: /
      fetch: index
      value: '{{uri}}'
  button_text:
    label: button text
    type:  text
    width: 1/2

  meta:
    label: Meta
    type: headline
  meta_title:
    label: Meta Title
    type:  text
    validate:
      min: 3
      max: 80
    help: Meta Title is the text showed in search engine results. Please enter a text between 50 and 60 characters.
    width: 1/2
  meta_description:
    label: Meta description
    type:  textarea
    validate:
      min: 3
      max: 200
    buttons: false
    help: Meta description is the text showed in search engine results. Please enter a text between 155 and 160 chars.
    width: 1/2