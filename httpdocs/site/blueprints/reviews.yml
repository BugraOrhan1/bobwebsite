title: Reviews

options:
  template: false
  status: false
  preview: true
  url: false
  delete: false

files: false
pages: false

fields:
  title:
    label: Title home
    type:  text
    width: 2/5
  title_in_menu:
    label: Hoofdmenu
    type: checkbox
    text: Tonen
    width: 1/5

  intro:
    label: Intro details
    type: headline
  intro_title:
    label: Title
    type:  text
    width: 1/3
  intro_description:
    label: html content
    type:  textarea
    width: 2/3

  reviews:
    label: Reviews
    type: headline

  review_list:
    label: Overview review
    type: structure
    modalsize: large
    width: 2/2
    entry: >
      <div style="text-align:left; font-size: 14px;">
             <b>{{s_sevice}}</b>  | {{s_country}} | {{s_title}} | {{s_name}}

      </div>
    fields:
      s_title:
        label: Title
        type: text
        width: 2/2
      s_name:
        label: Namen en plaats
        type: text
        width: 2/2
      s_content:
        label: Content
        type: textarea
      s_country:
        label: Land
        type: radio
        default: Nederland
        options:
          nl: Nederland
          be: Belgie
          de: Duitsland
      s_sevice:
        label: Afgenomen reiniging
        type: radio
        default: meubelreiniging
        options:
          Meubelreiniging: Meubelreiniging
          Bankreiniging: Bankreiniging
          Matrasreiniging: Matrasreiniging
          Auto interieurreiniging: Auto interieurreiniging
          Tapijtreiniging: Tapijtreiniging
          Gevelreiniging: Gevelreiniging
          Kantoorpanden: Kantoorpanden
          Zonnepanelen reinigen: Zonnepanelen reinigen




  meta:
    label: Meta
    type: headline
  meta_title:
    label: Meta Title
    type:  text
    width: 1/3
  meta_description:
    label: Meta description
    type:  textarea
    buttons: false
    width: 2/3
