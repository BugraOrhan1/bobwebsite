<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="./error_docs/assets/css/style.css">
    <title>Fout 415 - Niet-ondersteund Mediatype</title>
</head>

<body>

    <section class="error-section">
        <div class="bar"></div>
        <div class="mobile-error-image">
            <img src="./assets/images/mobile-error.jpg" class="d-block d-md-none w-100" alt="415">
        </div>
        <div class="container">
            <div class="row">
                <div class="col-md-7">
                    <div class="error-text">
                        <h3>Fout 415</h3>
                        <h1 class="color-orange">Niet-ondersteund Mediatype</h1>
                        <p>Het mediatype dat je probeert te gebruiken, wordt niet ondersteund door onze server. Zorg ervoor dat je een compatibel formaat gebruikt.</p>
                        <div class="error-list-wrap">
                            <p class="fw-bold">Wat je zou kunnen doen</p>
                            <div class="error-list">
                                <img src="./error_docs/assets/images/icon-refresh.svg" alt="">
                                <p>Herlaad de pagina</p>
                            </div>
                            <div class="error-list">
                                <img src="./error_docs/assets/images/icon-back.svg" alt="">
                                <p>Ga terug naar de vorige pagina</p>
                            </div>
                            <div class="error-list">
                                <img src="./error_docs/assets/images/icon-home.svg" alt="">
                                <p>Ga terug naar de homepagina</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
